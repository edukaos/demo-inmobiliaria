# Descarga fotos de Unsplash (licencia libre) listadas en scripts/fotos.txt a public/images/
name: Descargar fotos

on:
  workflow_dispatch:
  push:
    paths: ['scripts/fotos.txt']

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y optimizar
        run: |
          mkdir -p public/images
          grep -v '^\s*#' scripts/fotos.txt | while read -r nombre id; do
            [ -z "$nombre" ] && continue
            echo "Descargando $nombre ($id)"
            curl -fsSL "https://unsplash.com/photos/$id/download?force=true" -o "/tmp/$nombre" || { echo "  falló $id"; continue; }
            convert "/tmp/$nombre" -auto-orient -resize '1600x1600>' -strip -quality 78 "public/images/$nombre.jpg"
          done
          ls -la public/images
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/images
          git commit -m "Fotos descargadas de Unsplash" || echo "Sin cambios"
          git push
